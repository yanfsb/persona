[package]
name = "persona"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.85"

[package.metadata.persona]
validated-targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["parse", "serde"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
hmac = "0.12.1"
sha2 = "0.10.9"
serde_yaml = "0.9.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
